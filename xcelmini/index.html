 */const Q1=gt("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),kt=[{id:"cells",title:"Ячейки и данные",subtitle:"Начинаем с адресов и диапазонов",duration:3,icon:"Grid2X2",color:"green",intro:"Лист Excel состоит из ячеек. У каждой есть адрес, поэтому можно точно указать, где лежат нужные данные.",steps:[{title:"Найди адрес",text:"Столбцы обозначены латинскими буквами A, B, C, строки — числами. Адрес B3 означает столбец B, строку 3. Сначала идут буквы столбца, затем номер строки.",table:{headers:["","A","B","C"],rows:[["1","Товар","Цена","Количество"],["2","Тетрадь","120","2"],["3","Ручка","50","3"]],caption:"B3 — столбец B, строка 3. В этой ячейке находится число 50."}},{title:"Разделяй числа и подписи",text:"Выбери ячейку, введи 1250 и нажми Enter, чтобы сохранить ввод. Для расчётов храни суммы числами, а подписи — отдельно. Знак валюты можно показать через формат ячейки, не добавляя к числу слово «рублей»."},{title:"Читай диапазоны",text:"Двоеточие означает непрерывный диапазон. A2:A5 включает A2, A3, A4 и A5. В диапазон входят обе крайние ячейки."}],questions:[{id:"cells-address",prompt:"Какой адрес у ячейки в столбце C и строке 4?",options:["4C","C4","C:4","D4"],correct:1,explanation:"В адресе сначала пишут букву столбца, затем номер строки: C4.",hint:"Начни с буквы столбца.",seconds:30},{id:"cells-number",prompt:"Ты записываешь сумму для будущих расчётов. Какое значение лучше ввести в ячейку?",options:["Сумма: 1250","1250 рублей","1250","Оплачено"],correct:2,explanation:"1250 — число. Подписи со словами являются текстом. Валюту можно показать форматом, сохранив значение числом.",hint:"Для расчётов нужно число без слов.",seconds:35},{id:"cells-range",prompt:"Сколько ячеек входит в диапазон A2:A5?",options:["3","5","2","4"],correct:3,explanation:"В диапазоне четыре ячейки: A2, A3, A4 и A5. Обе границы включены.",hint:"Перечисли номера строк от 2 до 5 включительно.",seconds:35}]},{id:"formulas",title:"Первые формулы",subtitle:"Считаем с помощью ячеек",duration:4,icon:"Calculator",color:"pink",intro:"Формула связывает результат с исходными данными. Измени число в ячейке — и Excel пересчитает формулу, которая на неё ссылается.",steps:[{title:"Начни со знака =",text:"Выбери ячейку для результата и начни формулу со знака =. Для сложения используй +, для вычитания -, для умножения * и для деления /. Нажми Enter: например, =10+5 покажет результат 15.",formula:"=10+5"},{title:"Ссылайся на данные",text:"Если цена находится в B2, а количество — в C2, умножь цену на количество. Введи =B2*C2 в другую ячейку, например D2. При изменении цены или количества Excel сам пересчитает стоимость.",formula:"=B2*C2",table:{headers:["","A","B","C"],rows:[["1","Товар","Цена","Количество"],["2","Тетрадь","120","2"],["3","Ручка","50","3"]],caption:"B2 = 120, C2 = 2: стоимость тетрадей равна 240. В B3 находится цена ручки — 50."}},{title:"Управляй порядком",text:"Умножение и деление выполняются раньше сложения и вычитания. Скобки меняют порядок: в =(10+5)*2 сначала получится 15, затем 30.",formula:"=(10+5)*2"}],questions:[{id:"formulas-multiply",prompt:"В B2 цена 250, в C2 количество 3. Какая формула рассчитает стоимость покупки?",options:["=B2+C2","=B2/C2","=B2*C2","B2*C2"],correct:2,explanation:"Стоимость равна цене, умноженной на количество: =B2*C2. Получится 750. Знак = сообщает Excel, что это формула.",hint:"Для умножения в Excel используют звёздочку.",seconds:40,table:{headers:["","B","C"],rows:[["1","Цена","Количество"],["2","250","3"]]}},{id:"formulas-order",prompt:"Какой результат вернёт формула =10+5*2?",options:["30","20","25","17"],correct:1,explanation:"Сначала Excel умножит 5 на 2, затем прибавит 10. Результат — 20.",hint:"Умножение выполняется раньше сложения.",seconds:40,formula:"=10+5*2"},{id:"formulas-parentheses",prompt:"Нужно сначала сложить 10 и 5, а затем умножить всю сумму на 2. Выбери формулу.",options:["=10+5*2","=10+(5*2)","=(10+5)/2","=(10+5)*2"],correct:3,explanation:"Скобки объединяют 10+5. Excel сначала получает 15, затем умножает результат на 2: 30.",hint:"Возьми сложение в скобки.",seconds:40}]},{id:"sum",title:"Сумма без хлопот",subtitle:"СУММ для диапазона и отдельных ячеек",duration:4,icon:"Sigma",color:"yellow",intro:"СУММ складывает числа из выбранных ячеек. Это удобно для расходов, продаж и других списков, где вручную складывать каждую строку долго.",steps:[{title:"Сложи диапазон",text:"Укажи первую и последнюю ячейки через двоеточие. СУММ сложит числа во всём диапазоне, включая его границы.",formula:"=СУММ(B2:B6)",table:{headers:["","A","B"],rows:[["1","День","Расходы"],["2","Понедельник","120"],["3","Вторник","180"],["4","Среда","200"],["5","Четверг","100"],["6","Пятница","150"]],caption:"СУММ(B2:B6) складывает пять расходов: 120 + 180 + 200 + 100 + 150 = 750."}},{title:"Выбери отдельные ячейки",text:"В примерах курса отдельные аргументы разделяются точкой с запятой. Так можно сложить только B2 и B5, пропустив ячейки между ними. В твоём Excel разделитель может отличаться: он зависит от региональных настроек.",formula:"=СУММ(B2;B5)"},{title:"Проверь границы",text:"Ставь итог за пределами диапазона, который складываешь. Если итог находится в B7, диапазон B2:B6 включает данные и не захватывает сам итог.",formula:"=СУММ(B2:B6)"}],questions:[{id:"sum-result",prompt:"В B2:B4 записаны расходы. Какой итог вернёт =СУММ(B2:B4)?",options:["500","300","380","200"],correct:0,explanation:"СУММ складывает все три числа: 120 + 180 + 200 = 500.",hint:"Учти обе границы диапазона и число между ними.",seconds:45,table:{headers:["","B"],rows:[["2","120"],["3","180"],["4","200"]]},formula:"=СУММ(B2:B4)"},{id:"sum-range",prompt:"Итог будет в B7. Как сложить все пять значений из B2, B3, B4, B5 и B6?",options:["=СУММ(B2;B6)","=СУММ(B2:B5)","=СУММ(B2:B6)","=СУММ(B2:B7)"],correct:2,explanation:"B2:B6 включает все пять исходных ячеек. B7 с самой формулой не должна входить в сумму: иначе формула попыталась бы использовать собственный результат. Это называется циклической ссылкой.",hint:"Используй диапазон от первой исходной ячейки до последней.",seconds:45},{id:"sum-separate",prompt:"Нужно сложить только B2 и B5. Какой вариант подходит?",options:["=СУММ(B2:B5)","=СУММ(B2;B5)","=СУММ(B3:B5)","=СУММ(B2;B3;B5)"],correct:1,explanation:"Точка с запятой разделяет два аргумента: B2 и B5. Двоеточие включило бы также B3 и B4.",hint:"Двоеточие задаёт диапазон, точка с запятой перечисляет аргументы.",seconds:45}]},{id:"average",title:"Находим среднее",subtitle:"СРЗНАЧ и роль нуля",duration:4,icon:"ChartNoAxesCombined",color:"green",intro:"Среднее помогает увидеть типичное значение: средний чек, оценку или время выполнения. СРЗНАЧ складывает числа и делит сумму на их количество.",steps:[{title:"Посчитай среднее",text:"Для чисел 10, 20 и 30 среднее равно 20: сумма 60 делится на три числа. Функция выполняет оба действия за тебя.",formula:"=СРЗНАЧ(A1:A3)",table:{headers:["","A"],rows:[["1","10"],["2","20"],["3","30"]],caption:"Все три ячейки содержат числа. Их среднее: (10 + 20 + 30) / 3 = 20."}},{title:"Различай ноль и пустоту",text:"В диапазоне СРЗНАЧ пропускает пустые ячейки и текст, но учитывает 0 как число. У 10 и 0 среднее равно 5; у 10 и пустой ячейки — 10."},{title:"Выбери исходные значения",text:"Укажи все значения, которые хочешь усреднить. Строка с уже рассчитанным итогом не должна случайно попасть в этот диапазон.",formula:"=СРЗНАЧ(C2:C5)"}],questions:[{id:"average-result",prompt:"В A1:A3 находятся числа 10, 20 и 30. Чему равно их среднее?",options:["60","30","15","20"],correct:3,explanation:"Сумма равна 60. Делим её на три числа: 60 / 3 = 20.",hint:"Сложи числа, затем раздели на их количество.",seconds:40,formula:"=СРЗНАЧ(A1:A3)"},{id:"average-zero",prompt:"В A1 число 10, в A2 число 0, а A3 пустая. Что вернёт =СРЗНАЧ(A1:A3)?",options:["10","5","0","3,33"],correct:1,explanation:"Excel учитывает два числа: 10 и 0. Пустая A3 не участвует. (10 + 0) / 2 = 5.",hint:"Ноль участвует в расчёте, пустая ячейка — нет.",seconds:50,table:{headers:["","A"],rows:[["1","10"],["2","0"],["3",""]]},formula:"=СРЗНАЧ(A1:A3)"},{id:"average-formula",prompt:"Как найти среднее по всем четырём оценкам в C2:C5?",options:["=СРЗНАЧ(C2:C5)","=СУММ(C2:C5)","=СРЗНАЧ(C2;C5)","=СРЗНАЧ(C2:C4)"],correct:0,explanation:"СРЗНАЧ(C2:C5) учитывает все четыре оценки: (4 + 5 + 3 + 2) / 4 = 3,5.",hint:"Нужна функция среднего и непрерывный диапазон из четырёх ячеек.",seconds:45,table:{headers:["","C"],rows:[["1","Оценка"],["2","4"],["3","5"],["4","3"],["5","2"]]}}]},{id:"min-max",title:"Минимум и максимум",subtitle:"Находим границы данных",duration:4,icon:"ArrowDownUp",color:"pink",intro:"МИН и МАКС находят крайние числовые значения. Они помогут быстро увидеть самую низкую цену, крупнейшую продажу или разброс результатов.",steps:[{title:"Найди наименьшее",text:"МИН возвращает самое маленькое число в диапазоне. Порядок строк на результат не влияет.",formula:"=МИН(B2:B5)",table:{headers:["","A","B"],rows:[["1","Магазин","Цена"],["2","Первый","800"],["3","Второй","1200"],["4","Третий","900"],["5","Четвёртый","1100"]],caption:"Самая низкая цена в B2:B5 — 800. Именно её вернёт МИН."}},{title:"Найди наибольшее",text:"МАКС возвращает самое большое число. Функция показывает значение, а не название товара или адрес его ячейки.",formula:"=МАКС(B2:B5)"},{title:"Оцени разброс",text:"Вычти минимум из максимума, чтобы узнать разницу между крайними значениями. Для 5, 12, 8 и 15 она равна 10.",formula:"=МАКС(A1:A4)-МИН(A1:A4)"}],questions:[{id:"min-max-minimum",prompt:"В B2:B4 указаны цены: 800, 1200 и 900. Что вернёт =МИН(B2:B4)?",options:["1200","B2","800","900"],correct:2,explanation:"Наименьшее число — 800. МИН возвращает само значение, а не адрес B2.",hint:"Выбери самую низкую цену.",seconds:35,formula:"=МИН(B2:B4)"},{id:"min-max-maximum",prompt:"Как найти крупнейшую продажу среди чисел в C2:C6?",options:["=МИН(C2:C6)","=СУММ(C2:C6)","=СРЗНАЧ(C2:C6)","=МАКС(C2:C6)"],correct:3,explanation:"МАКС выбирает наибольшее значение. СУММ сложила бы продажи, а СРЗНАЧ нашла бы их среднее.",hint:"Нужна функция максимума.",seconds:35},{id:"min-max-spread",prompt:"В A1:A4 записаны 5, 12, 8 и 15. Чему равна разница между максимумом и минимумом?",options:["10","40","7","20"],correct:0,explanation:"Максимум — 15, минимум — 5. Разница: 15 − 5 = 10.",hint:"Из самого большого числа вычти самое маленькое.",seconds:45,formula:"=МАКС(A1:A4)-МИН(A1:A4)"}]},{id:"references",title:"Ссылки при копировании",subtitle:"Когда нужен знак доллара",duration:5,icon:"Link",color:"yellow",intro:"Одну формулу можно скопировать на много строк. Относительные ссылки подстроятся под новое место, а абсолютные сохранят выбранную ячейку.",steps:[{title:"Относительная ссылка меняется",text:"Скопируй ячейку B2 с формулой =A2*2 и вставь её в B3, на строку ниже. Относительная ссылка A2 тоже сместится на строку: новая формула будет =A3*2. Речь именно о копировании, а не о вырезании ячейки.",formula:"=A2*2",table:{headers:["","A","B"],rows:[["1","Число","Удвоенное число"],["2","10","20"],["3","15","30"]],caption:"В B2 формула =A2*2 даёт 20. После копирования в B3 формула =A3*2 даёт 30."}},{title:"Абсолютная остаётся на месте",text:"В $F$1 два знака $ фиксируют и столбец F, и строку 1. Такая ссылка сохранится при копировании формулы в любую сторону.",formula:"=B2*$F$1"},{title:"Совмещай два вида ссылок",text:"Ссылку на данные каждой строки оставляй относительной, а общую надбавку фиксируй. В =$A$1+B2 надбавка хранится в A1. При копировании на столбец вправо и строку вниз B2 станет C3, а $A$1 сохранится.",formula:"=$A$1+B2"}],questions:[{id:"references-relative",prompt:"В B2 записана формула =A2*2. Её копируют в B3, на одну строку ниже. Какая формула получится в B3?",options:["=A2*2","=A3*2","=B3*2","=A2*3"],correct:1,explanation:"Относительная ссылка смещается вместе с формулой: A2 становится A3. Число 2 остаётся прежним.",hint:"Сместилась только строка — на одну вниз.",seconds:45,formula:"=A2*2"},{id:"references-absolute",prompt:"В F1 хранится общая ставка. Какая ссылка фиксирует и столбец, и строку этой ячейки?",options:["F1","$F1","F$1","$F$1"],correct:3,explanation:"В $F$1 знак $ перед F фиксирует столбец, а перед 1 — строку. Оба элемента адреса сохранятся.",hint:"Для полной фиксации нужны два знака $.",seconds:40},{id:"references-combined",prompt:"Формулу =$A$1+B2 копируют из C2 в D3: на столбец вправо и строку вниз. Какая формула получится?",options:["=$A$1+C3","=$B$2+C3","=$A$1+B2","=$A$1+C2"],correct:0,explanation:"$A$1 остаётся прежней. Относительная B2 смещается на столбец вправо и строку вниз, поэтому становится C3.",hint:"Зафиксированную ячейку оставь, у второй измени и букву, и номер.",seconds:65,formula:"=$A$1+B2"}]},{id:"if",title:"Условие ЕСЛИ",subtitle:"Два результата по одному правилу",duration:5,icon:"GitBranch",color:"green",intro:"ЕСЛИ проверяет условие и выбирает один из двух результатов. Например, выдаёт зачёт при достаточном числе баллов или просит повторить материал.",steps:[{title:"Запомни три части",text:"Порядок такой: условие; ответ, если условие верно; ответ, если оно неверно. В примерах курса части разделяются точкой с запятой. Текстовые ответы нужно заключать в двойные кавычки.",formula:'=ЕСЛИ(C2>=60;"Зачёт";"Повторить")',table:{headers:["","A","B","C"],rows:[["1","Ученик","Результат","Баллы"],["2","Саша","Зачёт","60"],["3","Оля","Повторить","40"]],caption:"В C2 ровно 60 баллов. Условие C2>=60 верно, поэтому формула в B2 показывает «Зачёт»."}},{title:"Проверь границу",text:"Знак > означает «больше», а >= — «больше или равно». Для правила «от 60 баллов включительно» нужно C2>=60: ровно 60 тоже подходит.",formula:'=ЕСЛИ(C2>=60;"Зачёт";"Повторить")'},{title:"Сравнивай и текст",text:"Условие может сравнивать содержимое ячейки с текстом. Такой текст тоже нужен в кавычках. Формула проверит статус и выберет действие.",formula:'=ЕСЛИ(B2="Оплачен";"Отправить";"Проверить")'}],questions:[{id:"if-boundary",prompt:'В B2 ровно 1000. Что вернёт формула =ЕСЛИ(B2>=1000;"Бонус";"Без бонуса")?',options:["Без бонуса","1000","Бонус","Ошибка"],correct:2,explanation:"1000 больше или равно 1000, поэтому условие выполнено. ЕСЛИ возвращает первый результат — «Бонус».",hint:"Знак >= включает равенство.",seconds:45,formula:'=ЕСЛИ(B2>=1000;"Бонус";"Без бонуса")'},{id:"if-formula",prompt:"Зачёт получают все, у кого в C2 не меньше 60 баллов. Какая формула верна?",options:['=ЕСЛИ(C2>60;"Зачёт";"Повторить")','=ЕСЛИ(C2>=60;"Зачёт";"Повторить")','=ЕСЛИ(C2>=60;"Повторить";"Зачёт")','=ЕСЛИ(C2=60;"Зачёт";"Повторить")'],correct:1,explanation:"«Не меньше 60» записывается как >=60. При выполнении условия нужен «Зачёт», иначе — «Повторить».",hint:"Проверь и условие, и порядок двух результатов.",seconds:60},{id:"if-text",prompt:"В B2 записано «Ожидает». Какое действие вернёт формула ниже?",options:["Оплачен","Отправить","Ожидает","Проверить"],correct:3,explanation:"«Ожидает» не равно «Оплачен». Условие не выполнено, поэтому выбирается второй результат — «Проверить».",hint:"При невыполненном условии берётся последний аргумент.",seconds:45,formula:'=ЕСЛИ(B2="Оплачен";"Отправить";"Проверить")'}]},{id:"count",title:"Считаем ячейки",subtitle:"Чем СЧЁТ отличается от СЧЁТЗ",duration:4,icon:"Hash",color:"pink",intro:"Иногда нужен не итог чисел, а количество записей. СЧЁТ считает ячейки с числами, а СЧЁТЗ — все непустые ячейки.",steps:[{title:"СЧЁТ ищет числа",text:"СЧЁТ возвращает количество числовых значений в диапазоне. Ноль тоже число. Текст и пустые ячейки не учитываются.",formula:"=СЧЁТ(A2:A5)",table:{headers:["","A"],rows:[["1","Результат"],["2","12"],["3","План"],["4",""],["5","0"]],caption:"В A2:A5 два числа: 12 и 0. Текст «План» и пустая A4 не учитываются."}},{title:"СЧЁТЗ ищет заполненные",text:'СЧЁТЗ учитывает и числа, и текст, пропуская действительно пустые ячейки. Это удобно для списка имён. Ячейка с пробелом или формулой, возвращающей "", не считается пустой.',formula:"=СЧЁТЗ(B2:B6)"},{title:"Выбери вопрос к данным",text:"«Сколько числовых результатов внесено?» — СЧЁТ. «Сколько ячеек заполнено?» — СЧЁТЗ. Если нужно сложить значения, используй СУММ, а не функцию подсчёта."}],questions:[{id:"count-numbers",prompt:"В A2 число 12, в A3 текст «План», A4 пустая, а в A5 число 0. Что вернёт =СЧЁТ(A2:A5)?",options:["2","3","4","12"],correct:0,explanation:"Числовых значений два: 12 и 0. Текст «План» и пустая ячейка в подсчёт не входят.",hint:"СЧЁТ учитывает ноль, но пропускает текст.",seconds:50,table:{headers:["","A"],rows:[["2","12"],["3","План"],["4",""],["5","0"]]},formula:"=СЧЁТ(A2:A5)"},{id:"count-filled",prompt:"В списке три имени, а остальные две ячейки действительно пустые. Что вернёт =СЧЁТЗ(B2:B6)?",options:["0","5","2","3"],correct:3,explanation:"СЧЁТЗ учитывает каждую непустую ячейку. Имена занимают три ячейки, поэтому результат — 3.",hint:"Текст тоже заполняет ячейку.",seconds:40,table:{headers:["","B"],rows:[["2","Анна"],["3","Игорь"],["4",""],["5","Лена"],["6",""]]},formula:"=СЧЁТЗ(B2:B6)"},{id:"count-choose",prompt:"В C2:C20 люди вводят результаты: числа, текст «нет» или ничего. Как узнать количество именно числовых результатов?",options:["=СУММ(C2:C20)","=СЧЁТЗ(C2:C20)","=СЧЁТ(C2:C20)","=СРЗНАЧ(C2:C20)"],correct:2,explanation:"СЧЁТ вернёт количество чисел. СЧЁТЗ включила бы текст «нет», а СУММ и СРЗНАЧ выполняют другие расчёты.",hint:"Нужно количество чисел, а не заполненных ячеек и не сумма.",seconds:45}]},{id:"sort-filter",title:"Сортировка и фильтры",subtitle:"Наводим порядок в списках",duration:5,icon:"ListFilter",color:"yellow",intro:"Сортировка меняет порядок строк, а фильтр показывает строки по условию. Вместе они помогают находить нужные записи в большой таблице.",steps:[{title:"Сортируй строки целиком",text:"В настольном Excel выдели всю таблицу с заголовками и открой «Данные» → «Сортировка». Выбери столбец «Сумма» и укажи, что у таблицы есть заголовки. Тогда имя, сумма и статус каждого заказа переместятся вместе."},{title:"Выбери направление",text:"Сортировка по убыванию ставит большие числа выше маленьких: например, 1500, 900, 600. По возрастанию — наоборот. Выбери нужный порядок в окне сортировки. Для текста используются направления от А до Я и от Я до А.",table:{headers:["","A","B"],rows:[["1","Заказ","Сумма"],["2","№1","600"],["3","№2","1500"],["4","№3","900"]],caption:"Здесь показан исходный порядок. После сортировки по убыванию суммы: №2 → №3 → №1."}},{title:"Отбери нужные записи",text:"Открой «Данные» → «Фильтр»: у заголовков появятся стрелки для выбора условий. Например, в столбце «Статус» оставь «Оплачен». Фильтр скрывает остальные строки, не удаляя их. Условия разных столбцов действуют одновременно: строка должна подходить под каждое из них."}],questions:[{id:"sort-filter-order",prompt:"Заказы сортируют по сумме по убыванию. В каком порядке окажутся их номера?",options:["№1 → №3 → №2","№2 → №3 → №1","№3 → №2 → №1","№1 → №2 → №3"],correct:1,explanation:"По убыванию суммы идут так: 1500, 900, 600. Это заказы №2, №3 и №1.",hint:"Начни с самой большой суммы.",seconds:45,table:{headers:["Заказ","Сумма"],rows:[["№1","600"],["№2","1500"],["№3","900"]]}},{id:"sort-filter-conditions",prompt:"Заданы два фильтра: статус «Оплачен» и сумма не меньше 1000. Какие заказы останутся видимыми?",options:["№1 и №2","№2 и №3","Только №2","№1, №2 и №3"],correct:2,explanation:"Только №2 проходит оба условия: статус «Оплачен» и сумма 1500. У №1 сумма меньше 1000, а №3 ещё ожидает оплаты.",hint:"Каждая строка должна одновременно пройти оба фильтра.",seconds:60,table:{headers:["Заказ","Статус","Сумма"],rows:[["№1","Оплачен","600"],["№2","Оплачен","1500"],["№3","Ожидает","1200"],["№4","Ожидает","500"]]}},{id:"sort-filter-safe-sort",prompt:"Как отсортировать таблицу по сумме, сохранив правильные имена и статусы у заказов?",options:["Выделить всю таблицу с заголовками и сортировать по столбцу «Сумма»","Выделить только числа в столбце «Сумма» и сортировать лишь их","Отсортировать каждый столбец отдельно по возрастанию","Сначала удалить столбцы с именами и статусами"],correct:0,explanation:"Когда сортируется вся таблица, данные одной строки перемещаются вместе. Если переставить только суммы, они могут оказаться у чужих заказов.",hint:"Один заказ — одна строка. Все её значения должны двигаться вместе.",seconds:50}]},{id:"percent",title:"Проценты в деле",subtitle:"Скидка, рост и процентный формат",duration:5,icon:"Percent",color:"green",intro:"Процент — сотая часть числа. Excel хранит 25% как 0,25, поэтому проценты можно использовать в обычных формулах умножения и деления.",steps:[{title:"Значение и формат",text:"Запись 25% соответствует числу 0,25. Чтобы показать 0,25 как 25%, выбери ячейку и нажми кнопку % на вкладке «Главная» в группе «Число». Это процентный формат: он меняет отображение, сохраняя само значение."},{title:"Посчитай скидку",text:"Если в B2 цена, а в C2 скидка, введи в C2 именно 15%, а не 15: 15% равно 0,15. Сумма скидки равна B2*C2. Чтобы получить цену после скидки, умножь цену на оставшуюся долю: 1-C2.",formula:"=B2*(1-C2)",table:{headers:["","A","B","C","D"],rows:[["1","Товар","Цена","Скидка","После скидки"],["2","Куртка","2000","15%","1700"]],caption:"В D2 стоит =B2*(1-C2): 2000 × 0,85 = 1700. Сумма самой скидки — 300."}},{title:"Измерь изменение",text:"Вычти старое значение из нового и раздели разницу на старое. При росте с 1000 до 1200 получится 0,2. В процентном формате это 20%. Если старое значение равно нулю, такой расчёт не подходит: на ноль делить нельзя.",formula:"=(1200-1000)/1000"}],questions:[{id:"percent-discount",prompt:"В B2 цена 2000, в C2 скидка 15%. Какая формула вернёт цену после скидки — 1700?",options:["=B2*C2","=B2*(1+C2)","=B2-C2","=B2*(1-C2)"],correct:3,explanation:"После скидки остаётся 85% цены: 1 − 15% = 85%. 2000 × 0,85 = 1700. B2*C2 рассчитала бы только сумму скидки — 300.",hint:"Из полной доли, равной 1, вычти долю скидки.",seconds:60,table:{headers:["","B","C"],rows:[["1","Цена","Скидка"],["2","2000","15%"]]}},{id:"percent-growth",prompt:"Цена выросла с 1000 до 1200. На сколько процентов она выросла относительно старой цены?",options:["200%","20%","16,67%","2%"],correct:1,explanation:"Прирост равен 200. Делим на старую цену 1000: 200 / 1000 = 0,2 = 20%. База сравнения — начальное значение.",hint:"Разницу раздели на старую цену, а не на новую.",seconds:55,formula:"=(1200-1000)/1000"},{id:"percent-format",prompt:"В A1 хранится число 0,25. Как оно отобразится после применения процентного формата без десятичных знаков?",options:["25%","0,25%","250%","2,5%"],correct:0,explanation:"0,25 — это четверть единицы, то есть 25%. Процентный формат меняет отображение числа, сохраняя его значение.",hint:"Один процент соответствует 0,01.",seconds:40}]}],gv={cells:{title:"Собрать фестиваль",questions:[{id:"cells-address",missionIntro:"До открытия фестиваля десять минут. На входе перепутали имя в списке гостей.",prompt:"Нужно исправить имя «Лера». Какую ячейку выбрать?",options:["B3","A2","C3","A3"],correct:3,explanation:"Имена находятся в столбце A. Лера записана в строке 3, поэтому её ячейка — A3. B3 содержит номер билета.",hint:"Найди имя в таблице, затем прочитай букву его столбца и номер строки.",seconds:35,table:{headers:["","A","B","C"],rows:[["1","Гость","Билет","Сектор"],["2","Тим","104","Синий"],["3","Лера","108","Зелёный"]]}},{id:"cells-number",missionIntro:"Теперь нужно посчитать, сколько людей придёт от каждой команды.",prompt:"В B4 ввели «18 гостей». Как подготовить эту запись для расчётов?",options:["Оставить 18 числом в B4, а слово «Гостей» вынести в заголовок","Применить числовой формат к тексту «18 гостей»","Выровнять запись «18 гостей» по правому краю","Оставить «18 гостей»: СУММ сама отбросит слово"],correct:0,explanation:"Запись «18 гостей» хранится как текст: СУММ не извлечёт из неё число 18. Числовой формат и выравнивание меняют оформление, а не убирают слова. Оставь 18 числом, а подпись вынеси в заголовок.",hint:"Раздели само количество и подпись к нему.",seconds:40},{id:"cells-range",missionIntro:"Осталось передать охране чистый список — без заголовка и итоговой строки.",prompt:"Имена занимают A2–A8. В A1 заголовок, в A9 итог. Какой диапазон выделить?",options:["A1:A8","A2:A8","A2:A9","A2;A8"],correct:1,explanation:"Диапазон A2:A8 захватит все семь имён. Заголовок A1 и итог A9 останутся снаружи. A2;A8 перечисляет только две крайние ячейки.",hint:"Начни с первого имени и закончи последним. Границы тоже входят в диапазон.",seconds:40}]},formulas:{title:"Мерч без убытка",questions:[{id:"formulas-multiply",missionIntro:"Ты отвечаешь за стойку с мерчем. Сначала нужно понять, сколько денег осталось после расходов.",prompt:"В B2 выручка, в C2 аренда, в D2 печать. Какая формула рассчитает остаток денег?",options:["=B2+C2+D2","=B2-(C2-D2)","=B2-C2-D2","=C2+D2-B2"],correct:2,explanation:"Из выручки нужно вычесть оба расхода: =B2-C2-D2. По таблице получится 12000 − 3500 − 4200 = 4300.",hint:"Начни с поступивших денег и вычти каждый расход.",seconds:45,table:{headers:["","B","C","D"],rows:[["1","Выручка","Аренда","Печать"],["2","12000","3500","4200"]]}},{id:"formulas-order",missionIntro:"Брелоки разлетаются наборами: в каждом по пять штук.",prompt:"Было 48 брелоков, продали 6 наборов по 5. Какой остаток покажет =48-6*5?",options:["210","42","30","18"],correct:3,explanation:"Сначала считается количество проданных брелоков: 6 × 5 = 30. Затем остаток: 48 − 30 = 18. Скобки вокруг 48−6 изменили бы смысл расчёта.",hint:"Сначала выясни, сколько отдельных брелоков ушло в наборах.",seconds:45,formula:"=48-6*5"},{id:"formulas-parentheses",missionIntro:"Перед закрытием обнаружилась ошибка в расчёте прибыли с футболок.",prompt:"Цена футболки 950, печать одной стоит 650. Продали 13 штук. Какая формула найдёт прибыль?",options:["=950-650*13","=(950-650)*13","=(950+650)*13","=950-(650-13)"],correct:1,explanation:"Сначала получаем прибыль с одной футболки: 950 − 650 = 300. Затем умножаем на 13 проданных: 3900. Поэтому вычитание нужно взять в скобки.",hint:"Сначала посчитай прибыль с одной вещи, а уже потом — со всех проданных.",seconds:55}]},sum:{title:"Киноночь во дворе",questions:[{id:"sum-result",missionIntro:"Во дворе устроили киноночь. Часть билетов вернули, а потом пришла новая компания.",prompt:"Какой итог по кассе вернёт =СУММ(C2:C4), если возврат записан отрицательным числом?",options:["3900","1800","2700","3300"],correct:2,explanation:"СУММ (SUM) складывает и положительные, и отрицательные числа: 2400 + (−600) + 900 = 2700. Возврат уменьшает кассу.",hint:"Поступления прибавляются, а возврат уменьшает общий итог.",seconds:50,table:{headers:["","B","C"],rows:[["1","Операция","Сумма"],["2","Билеты","2400"],["3","Возврат","-600"],["4","Новые билеты","900"]]},formula:"=СУММ(C2:C4)"},{id:"sum-range",missionIntro:"Кассир добавил итог под поступлениями, но Excel предупредил об ошибке.",prompt:"В D7 записали =СУММ(D2:D7). Что здесь вызывает циклическую ссылку?",options:["Формула включает собственную ячейку D7","В диапазоне больше двух чисел","Перед СУММ стоит знак =","У диапазона есть две границы"],correct:0,explanation:"Итог в D7 пытается включить сам себя в сумму. Для поступлений из D2:D6 нужна формула =СУММ(D2:D6), записанная за пределами этого диапазона.",hint:"Сравни адрес ячейки с формулой и последнюю ячейку её диапазона.",seconds:45,formula:"=СУММ(D2:D7)"},{id:"sum-separate",missionIntro:"В одном списке смешали доходы и расходы. Для отчёта нужны только билеты и взносы за напитки.",prompt:"Что покажет =СУММ(C2;C5), если кассир выбрал только две нужные строки?",options:["3750","2250","1900","2600"],correct:3,explanation:"Точка с запятой перечисляет отдельные аргументы: C2 и C5. Получится 1900 + 700 = 2600. Значения C3 и C4 в эту формулу не входят.",hint:"Посмотри только на адреса, прямо перечисленные в скобках.",seconds:50,table:{headers:["","B","C"],rows:[["1","Статья","Сумма"],["2","Билеты","1900"],["3","Аренда экрана","800"],["4","Стаканы","350"],["5","Взносы за напитки","700"]]},formula:"=СУММ(C2;C5)"}]},average:{title:"Очередь за кофе",questions:[{id:"average-result",missionIntro:"В маленькой кофейне пообещали готовить заказы в среднем не дольше шести минут. Проверь первые замеры.",prompt:"Три заказа готовились 4, 5 и 12 минут. Выполнено обещание по среднему времени?",options:["Да: самый быстрый заказ готов за 4 минуты","Нет: среднее время — 7 минут","Да: среднее время — 5 минут","Нет: среднее время — 21 минута"],correct:1,explanation:"СРЗНАЧ (AVERAGE) даст (4 + 5 + 12) / 3 = 21 / 3 = 7 минут. Это больше обещанных 6. Один быстрый заказ не подтверждает обещание о среднем времени.",hint:"Сравни с обещанием среднее всех трёх замеров, а не самый быстрый результат.",seconds:50,table:{headers:["","D"],rows:[["1","Минуты"],["2","4"],["3","5"],["4","12"]]},formula:"=СРЗНАЧ(D2:D4)"},{id:"average-zero",missionIntro:"Бариста ведёт почасовой отчёт. Ноль означает, что кофейня работала, но заказов не было.",prompt:"В E2:E5 стоят 8, 0, пустая ячейка и текст «Ремонт». Что вернёт =СРЗНАЧ(E2:E5)?",options:["2","8","4","0"],correct:2,explanation:"В расчёте участвуют два числа: 8 и 0. Пустая ячейка и текст «Ремонт» пропускаются. Среднее равно (8 + 0) / 2 = 4.",hint:"Отдели числовые значения от текста и отсутствующих данных.",seconds:55,table:{headers:["","E"],rows:[["2","8"],["3","0"],["4",""],["5","Ремонт"]]},formula:"=СРЗНАЧ(E2:E5)"},{id:"average-formula",missionIntro:"Владелец получил странное среднее — 75 чашек в день, хотя ни в один день столько не продавали.",prompt:"В B2:B4 продажи за три дня, а в B5 их общий итог. Что лишнее в =СРЗНАЧ(B2:B5)?",options:["Ячейка B2 с первым днём","Знак = перед функцией","Само название СРЗНАЧ","Ячейка B5 с общим итогом"],correct:3,explanation:"B5 содержит сумму трёх дней, а не ещё один день. Правильный диапазон — B2:B4: (40 + 50 + 60) / 3 = 50 чашек. С включённым итогом получается 300 / 4 = 75.",hint:"Каждая ячейка в среднем должна описывать один и тот же вид наблюдения — один день.",seconds:55,table:{headers:["","A","B"],rows:[["1","День","Чашки"],["2","Пн","40"],["3","Вт","50"],["4","Ср","60"],["5","Итого","150"]]},formula:"=СРЗНАЧ(B2:B5)"}]},"min-max":{title:"Доставка до двери",questions:[{id:"min-max-minimum",missionIntro:"Служба доставки проверяет, не замёрзли ли продукты в дороге.",prompt:"Датчик записал температуры 4, 9, −2 и 6 °C. Какое значение покажет МИН?",options:["−2","9","2","4"],correct:0,explanation:"МИН (MIN) выбирает наименьшее число, включая отрицательные. −2 меньше 4, 6 и 9, поэтому минимальная температура — −2 °C.",hint:"Отрицательное значение находится ниже нуля.",seconds:40,formula:"=МИН(B2:B5)",table:{headers:["","B"],rows:[["2","4"],["3","9"],["4","-2"],["5","6"]]}},{id:"min-max-maximum",missionIntro:"Диспетчер ищет самую долгую доставку, чтобы разобраться с задержкой.",prompt:"Для разбора задержки используют =МАКС(C2:C5). Чью доставку нужно проверить первой?",options:["Киры — 18 минут","Нины — 26 минут","Льва — 41 минута","Тима — 35 минут"],correct:2,explanation:"МАКС (MAX) найдёт наибольшее время — 41 минуту. В таблице оно относится ко Льву. Сама функция возвращает число 41, а имя курьера мы находим по соответствующей строке.",hint:"Найди крайнее время, а затем сопоставь его со строкой курьера.",seconds:45,table:{headers:["","B","C"],rows:[["1","Курьер","Минуты"],["2","Нина","26"],["3","Лев","41"],["4","Кира","18"],["5","Тим","35"]]},formula:"=МАКС(C2:C5)"},{id:"min-max-spread",missionIntro:"Сервис обещает: разница между самой быстрой и самой медленной доставкой — не больше 15 минут.",prompt:"Четыре доставки заняли 19, 24, 31 и 38 минут. Удалось выполнить обещание?",options:["Да, разница 14 минут","Нет, разница 19 минут","Да, разница 9 минут","Нет, разница 38 минут"],correct:1,explanation:"Самая медленная доставка заняла 38 минут, самая быстрая — 19. Разница 38 − 19 = 19 минут: это больше допустимых 15.",hint:"Сравни два крайних времени, затем сопоставь разницу с обещанием.",seconds:55,formula:"=МАКС(A1:A4)-МИН(A1:A4)"}]},references:{title:"Поездка на выходные",questions:[{id:"references-relative",missionIntro:"Компания собирается в поездку. В каждой строке таблицы — бюджет одного дня.",prompt:"В E4 стоит =C4+D4: жильё плюс еда. Её копируют в E6, на две строки вниз. Что получится?",options:["=C4+D4","=E6+F6","=C6+D6","=C5+D5"],correct:2,explanation:"При копировании на две строки вниз обе относительные ссылки смещаются на две строки: C4 → C6, D4 → D6. Столбцы не меняются.",hint:"Пройди одинаковое расстояние от каждой исходной ссылки.",seconds:50,formula:"=C4+D4"},{id:"references-absolute",missionIntro:"Цены на жильё записаны в другой валюте. Единый курс хранится в B1.",prompt:"В формуле =C4*$B$1 зачем стоят два знака $?",options:["Чтобы курс в B1 не менялся при копировании формулы в любом направлении","Чтобы превратить C4 в цену в долларах","Чтобы зафиксировать только строку 4","Чтобы автоматически обновлять курс из интернета"],correct:0,explanation:"$ перед B фиксирует столбец, а $ перед 1 — строку. Поэтому ссылка $B$1 сохранится при копировании и вниз, и вправо. Знаки $ сами по себе не задают валюту.",hint:"Знак $ относится к части адреса сразу после него, а не к денежному формату.",seconds:45,formula:"=C4*$B$1"},{id:"references-combined",missionIntro:"Друг скопировал расчёт в соседний блок и случайно изменил адрес курса.",prompt:"Из F5 в H7 копируют =E5*$B$1: на два столбца вправо и две строки вниз. Какая формула верна?",options:["=G7*$D$3","=E5*$B$1","=G5*$B$1","=G7*$B$1"],correct:3,explanation:"Относительная E5 смещается на два столбца и две строки: G7. Полностью закреплённая $B$1 остаётся адресом курса. Получается =G7*$B$1.",hint:"Перенеси незакреплённый адрес, но сохрани адрес курса целиком.",seconds:65,formula:"=E5*$B$1"}]},if:{title:"Билеты на концерт",questions:[{id:"if-boundary",missionIntro:"На камерный концерт можно продать только 40 билетов. Счётчик уже показывает 39.",prompt:'В C2 число 39. Какой статус вернёт =ЕСЛИ(C2<40;"Есть места";"Солдаут")?',options:["Солдаут","Есть места","39","Ошибка"],correct:1,explanation:"39 меньше 40, условие верно. ЕСЛИ (IF) выбирает первый результат — «Есть места». При C2 = 40 условие стало бы неверным, а статусом был бы «Солдаут».",hint:"Сначала реши, осталось ли хотя бы одно место до лимита.",seconds:45,formula:'=ЕСЛИ(C2<40;"Есть места";"Солдаут")'},{id:"if-formula",missionIntro:"Для компании от четырёх человек билет стоит 700, для остальных — 900.",prompt:"В C2 записано 3 билета. Какой итог вернёт =ЕСЛИ(C2>=4;C2*700;C2*900)?",options:["2100","900","2700","700"],correct:2,explanation:"Три билета меньше четырёх, поэтому условие C2>=4 неверно. Выбирается второй расчёт: C2*900 = 3 × 900 = 2700.",hint:"Сначала проверь право на групповую цену, затем посчитай стоимость всех билетов.",seconds:60,formula:"=ЕСЛИ(C2>=4;C2*700;C2*900)"},{id:"if-text",missionIntro:"В системе отменённому заказу ошибочно предлагают проверить билет вместо возврата денег.",prompt:"Как записать правило: если в D2 «Отменён», показать «Возврат», иначе — «Проверить билет»?",options:['=ЕСЛИ(D2="Отменён";"Возврат";"Проверить билет")','=ЕСЛИ(D2="Отменён";"Проверить билет";"Возврат")','=ЕСЛИ(D2="Возврат";"Отменён";"Проверить билет")','=ЕСЛИ(D2="Отменён";"Возврат";"Возврат")'],correct:0,explanation:"После условия сначала идёт результат для верного условия — «Возврат», затем для неверного — «Проверить билет». Текст статуса и оба ответа заключены в кавычки.",hint:"Проверь, что проверяется в первой части и какое действие стоит сразу после неё.",seconds:60}]},count:{title:"Запустить клуб",questions:[{id:"count-numbers",missionIntro:"Для нового клуба собирают анкеты. Кто-то указал возраст, кто-то написал «гость», а кто-то пропустил поле.",prompt:"В B2:B6 записаны 21, «гость», 18, 0 и пустая ячейка. Сколько чисел найдёт СЧЁТ?",options:["5","4","2","3"],correct:3,explanation:"СЧЁТ (COUNT) найдёт три числовые записи: 21, 18 и 0. Текст «гость» и пустая ячейка не учитываются. Функция считает числа, но не проверяет, осмыслен ли введённый возраст.",hint:"Ноль тоже записан числом, даже если его нужно проверить отдельно.",seconds:50,table:{headers:["","B"],rows:[["2","21"],["3","гость"],["4","18"],["5","0"],["6",""]]},formula:"=СЧЁТ(B2:B6)"},{id:"count-filled",missionIntro:"На первую встречу записались по именам. СЧЁТ почему-то показал ноль участников.",prompt:"В A2:A9 стоят только имена и действительно пустые ячейки. Что заменит =СЧЁТ(A2:A9), чтобы посчитать записавшихся?",options:["=СУММ(A2:A9)","=СЧЁТЗ(A2:A9)","=МАКС(A2:A9)","=СРЗНАЧ(A2:A9)"],correct:1,explanation:"Имена — текст, поэтому СЧЁТ их не видит. СЧЁТЗ (COUNTA) считает все непустые ячейки, включая имена. В этом списке это и будет количество записавшихся.",hint:"Нужна функция для заполненных ячеек, а не только для числовых.",seconds:45},{id:"count-choose",missionIntro:"В анкете есть хитрая строка: формула возвращает пустой текст, и ячейка выглядит незаполненной.",prompt:'В A2 имя «Ника», A3 действительно пустая, в A4 формула ="", в A5 «Олег», в A6 число 0. Что вернёт СЧЁТЗ(A2:A6)?',options:["2","3","4","5"],correct:2,explanation:"Непустых ячеек четыре: A2, A4, A5 и A6. Формула в A4 остаётся содержимым ячейки, даже если показывает пустой текст. Ноль тоже учитывается. Пропускается только действительно пустая A3.",hint:"Внешне пустая ячейка и ячейка без содержимого — не всегда одно и то же.",seconds:65,formula:"=СЧЁТЗ(A2:A6)"}]},"sort-filter":{title:"Барахолка в чате",questions:[{id:"sort-filter-order",missionIntro:"В чате открыли барахолку. Покупатель хочет сначала увидеть самые доступные вещи.",prompt:"Отсортируй цены по возрастанию. Какой порядок товаров получится?",options:["Лампа → Куртка → Скейт","Скейт → Куртка → Лампа","Куртка → Лампа → Скейт","Лампа → Скейт → Куртка"],correct:0,explanation:"При сортировке по возрастанию цены идут от меньшей к большей: 350, 800, 1200. Это лампа, куртка и скейт. Строки с названиями и ценами перемещаются вместе.",hint:"Начни с самой низкой цены и двигайся вверх.",seconds:45,table:{headers:["Товар","Цена"],rows:[["Куртка","800"],["Лампа","350"],["Скейт","1200"]]}},{id:"sort-filter-conditions",missionIntro:"Друг ищет книги и комиксы, но готов потратить не больше 500 на одну покупку.",prompt:"Фильтры: категория «Книги» и цена не больше 500. Какие объявления останутся?",options:["Атлас и Роман","Только Атлас","Атлас, Шахматы и Комикс","Атлас и Комикс"],correct:3,explanation:"Атлас за 450 и комикс за 500 проходят оба условия. Роман дороже лимита, а шахматы относятся к другой категории. «Не больше 500» включает цену ровно 500.",hint:"Для каждого объявления проверь и категорию, и верхнюю границу цены.",seconds:60,table:{headers:["Товар","Категория","Цена"],rows:[["Атлас","Книги","450"],["Роман","Книги","700"],["Шахматы","Игры","300"],["Комикс","Книги","500"]]}},{id:"sort-filter-safe-sort",missionIntro:"После отбора в списке пропало несколько вещей. Организатор решил, что объявления удалились.",prompt:"Как снова увидеть все строки, скрытые фильтром?",options:["Вводить скрытые объявления заново","Очистить условия фильтра","Удалить видимые строки","Сложить цены через СУММ"],correct:1,explanation:"Фильтр скрывает неподходящие строки, а не удаляет их. Очистка условий фильтра снова покажет полный список. Создавать объявления заново не нужно.",hint:"Изменилось только то, какие строки показываются на экране.",seconds:45}]},percent:{title:"Студия на старте",questions:[{id:"percent-discount",missionIntro:"Ты запускаешь студию съёмки. Чтобы забронировать дату, клиент вносит предоплату.",prompt:"Съёмка стоит 4800. Предоплата — 30% стоимости. Какую сумму попросить перевести?",options:["3360","1600","1440","4770"],correct:2,explanation:"Нужна именно сумма предоплаты: 4800 × 30% = 4800 × 0,3 = 1440. Оставшиеся 3360 клиент заплатит позже.",hint:"Предоплата — часть полной стоимости, а не сумма, которая останется после неё.",seconds:50,formula:"=4800*30%"},{id:"percent-growth",missionIntro:"Заказов стало больше. Цену короткого ролика решили повысить на четверть.",prompt:"Старая цена в B2 — 800, рост в C2 — 25%. Какая формула даст новую цену 1000?",options:["=B2*(1-C2)","=B2*C2","=B2+C2","=B2*(1+C2)"],correct:3,explanation:"Новая цена составляет 100% старой плюс 25% роста:
